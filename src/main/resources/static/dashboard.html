<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İstanbul Rail-Route - Ana Menü</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .metro-gradient {
            background: linear-gradient(135deg, #1e3a8a 0%, #dc2626 100%);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col md:flex-row font-sans text-gray-800">

<div class="w-full md:w-64 bg-gray-900 text-gray-300 flex flex-col justify-between p-5 shadow-xl border-r border-gray-800 shrink-0">
    <div class="space-y-8">
        <div class="flex items-center space-x-3 pb-4 border-b border-gray-800">
            <div class="w-10 h-10 rounded-full bg-red-600 flex items-center justify-center text-white text-lg shadow-md">
                <i class="fa-solid fa-train-subway"></i>
            </div>
            <div>
                <h2 class="text-white font-black text-sm tracking-wide">RAIL-ROUTE</h2>
                <p class="text-gray-500 font-bold text-xxs uppercase tracking-widest">Ana Kontrol Paneli</p>
            </div>
        </div>

        <nav class="flex flex-col space-y-3">
            <button onclick="window.location.href='/payment.html'" class="w-full flex items-center space-x-3 px-4 py-3.5 rounded-xl bg-gray-800/50 hover:bg-green-700/20 hover:text-green-400 border border-transparent hover:border-green-600/30 font-bold text-sm tracking-wide text-gray-400 text-left cursor-pointer transition-all">
                <i class="fa-solid fa-wallet text-base w-5"></i>
                <span>Bakiye Yükle</span>
            </button>

            <button onclick="window.location.href='/route.html'" class="w-full flex items-center space-x-3 px-4 py-3.5 rounded-xl bg-gray-800/50 hover:bg-purple-700/20 hover:text-purple-400 border border-transparent hover:border-purple-600/30 font-bold text-sm tracking-wide text-gray-400 text-left cursor-pointer transition-all">
                <i class="fa-solid fa-map-location-dot text-base w-5"></i>
                <span>Rota Hesapla</span>
            </button>
        </nav>
    </div>

    <button onclick="logout()" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-bold text-sm text-red-400 hover:bg-red-950/40 border border-transparent hover:border-red-900/30 text-left cursor-pointer transition-all mt-6">
        <i class="fa-solid fa-right-from-bracket text-base w-5"></i>
        <span>Sistemden Çıkış</span>
    </button>
</div>

<div class="flex-1 p-6 md:p-10 flex items-center justify-center">

    <div class="bg-white w-full max-w-4xl rounded-2xl shadow-xl overflow-hidden grid grid-cols-1 md:grid-cols-2 border border-gray-100 min-h-[250px]">

        <div class="p-8 flex flex-col justify-center items-center text-center bg-slate-50 border-b md:border-b-0 md:border-r border-gray-100">
            <div class="w-20 h-20 bg-gradient-to-tr from-blue-900 to-blue-700 rounded-full flex items-center justify-center text-white text-3xl font-black shadow-md mb-4" id="user-avatar-text">
                -
            </div>
            <p class="text-gray-400 text-xs font-black uppercase tracking-widest mb-1">Hoş Geldiniz, Yolcu</p>
            <h2 id="display-username" class="text-3xl font-black text-gray-900 tracking-tight">Kullanıcı</h2>
            <div class="mt-3 px-3 py-1 bg-blue-100 text-blue-800 text-xs font-bold rounded-full uppercase tracking-wider">
                Profil Aktif
            </div>
        </div>

        <div class="p-8 flex flex-col justify-center items-center text-center bg-white">
            <div class="w-16 h-16 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center text-3xl shadow-xs mb-4">
                <i class="fa-solid fa-id-card"></i>
            </div>
            <p class="text-gray-400 text-xs font-black uppercase tracking-widest mb-1">Sanal İstanbulkart Bakiyesi</p>
            <h2 id="display-balance" class="text-4xl font-black text-gray-900 tracking-wide">0.00 TL</h2>
            <p class="text-xxs text-gray-400 font-medium mt-2">Finansal Limit Kontrolleri Aktif</p>
        </div>

    </div>
</div>

<script>
    // Sayfa tarayıcıda yüklenir yüklenmez çalışacak olan güvenlik duvarı
    window.onload = function() {
        // localStorage üzerinden profil bilgisini çekiyoruz
        var savedUser = localStorage.getItem('currentUser');

        // Eğer sisteme giriş yapılmadıysa, uyanıklık yapıp direkt bu sayfaya gelmeye çalışanları kapıya geri şutluyoruz
        if (!savedUser) {
            window.location.href = '/index.html';
            return;
        }

        // JSON verisini JavaScript nesnesine çözüyoruz
        var user = JSON.parse(savedUser);

        // 1. SOL TARAF: Kullanıcı adını ekrana basma
        document.getElementById('display-username').innerText = user.username;

        // Sol taraftaki yuvarlak avatarın içine baş harfleri yerleştirme
        if (user.username && user.username.length >= 2) {
            document.getElementById('user-avatar-text').innerText = user.username.substring(0, 2).toUpperCase();
        } else if (user.username) {
            document.getElementById('user-avatar-text').innerText = user.username.substring(0, 1).toUpperCase();
        }

        // 2. SAĞ TARAF: Sanal kart bakiyesini kurallara göre ekrana iki basamaklı (fixed) basma
        if (user.virtualCard && user.virtualCard.balance !== undefined) {
            document.getElementById('display-balance').innerText = user.virtualCard.balance.toFixed(2) + ' TL';
        } else {
            document.getElementById('display-balance').innerText = '0.00 TL';
        }
    };

    // Oturumu Güvenli Kapatma Fonksiyonu
    function logout() {
        localStorage.removeItem('currentUser'); // Hafızayı tamamen temizle
        window.location.href = '/index.html'; // Giriş ekranına geri yolla
    }
</script>
</body>
</html>
