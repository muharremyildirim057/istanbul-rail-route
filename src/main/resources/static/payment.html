<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Istanbul Rail Route - Top-up Balance</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1a1a2e;
            background-image: radial-gradient(circle at center, #16213e 0%, #0f3460 100%);
            display: flex;
            height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 20px;
        }
        .sidebar-top {
            width: 100%;
        }
        .brand {
            font-size: 20px;
            font-weight: 700;
            color: #e94560;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .menu-btn:hover, .menu-btn.active {
            background: #e94560;
            border-color: #e94560;
            box-shadow: 0 0 12px rgba(233, 69, 96, 0.4);
            transform: translateX(5px);
        }
        .admin-option {
            border: 1px dashed rgba(233, 69, 96, 0.5);
        }
        .admin-option:hover {
            background: #e94560;
        }
        .hidden {
            display: none !important;
        }
        .logout-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }
        .logout-btn:hover {
            background: rgba(255, 75, 75, 0.2);
            border-color: #ff4b4b;
            box-shadow: none;
            transform: none;
        }
        .main-content {
            flex: 1;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
        }
        .payment-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 500px;
        }
        .payment-card h2 {
            font-size: 24px;
            color: #e94560;
            margin-bottom: 5px;
            text-align: center;
        }
        .balance-info {
            text-align: center;
            margin-bottom: 30px;
            color: #a2a2a2;
            font-size: 14px;
        }
        .balance-info span {
            color: #fff;
            font-weight: bold;
            font-size: 18px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 14px 15px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 16px;
            color: #fff;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        input:focus {
            border-color: #e94560;
            outline: none;
            box-shadow: 0 0 8px rgba(233, 69, 96, 0.4);
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .col {
            flex: 1;
        }
        .quick-amounts {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .quick-btn {
            flex: 1;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }
        .quick-btn:hover {
            background: rgba(233, 69, 96, 0.2);
            border-color: #e94560;
        }
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background: #d63d56;
        }
        .msg-box {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
            display: none;
            line-height: 1.5;
        }
        .msg-box.error {
            background: rgba(255, 107, 107, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }
        .msg-box.success {
            background: rgba(46, 213, 115, 0.1);
            color: #2ed573;
            border: 1px solid rgba(46, 213, 115, 0.3);
        }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-top">
        <div class="brand">Istanbul Rail Route</div>
        <div class="menu-options">
            <a href="mainmenu.html" class="menu-btn">Dashboard</a>
            <a href="route.html" class="menu-btn">Calculate Route</a>
            <a href="payment.html" class="menu-btn active">Top-up Balance</a>
            <a href="adminpanel.html" id="admin-nav" class="menu-btn admin-option hidden">Edit Lines</a>
        </div>
    </div>
    <a href="index.html" class="menu-btn logout-btn">Logout</a>
</div>

<div class="main-content">
    <div class="payment-card">
        <h2>Top-up Account</h2>
        <div class="balance-info">Current Balance: <span id="current-balance">0.00</span> ₺</div>

        <div id="message-box" class="msg-box"></div>

        <form id="paymentForm">
            <div class="form-group">
                <label>Card Number</label>
                <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" required>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label>Expiry Date</label>
                    <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" required>
                </div>
                <div class="col form-group">
                    <label>CVV</label>
                    <input type="password" id="cvv" placeholder="123" maxlength="3" required>
                </div>
            </div>

            <div class="form-group">
                <label>Amount (₺)</label>
                <input type="number" id="amount" placeholder="Min 30 ₺ - Max 3500 ₺" min="30" max="3500" required>
            </div>

            <div class="quick-amounts">
                <button type="button" class="quick-btn" onclick="setAmount(50)">+50 ₺</button>
                <button type="button" class="quick-btn" onclick="setAmount(100)">+100 ₺</button>
                <button type="button" class="quick-btn" onclick="setAmount(200)">+200 ₺</button>
                <button type="button" class="quick-btn" onclick="setAmount(500)">+500 ₺</button>
            </div>

            <button type="submit" class="submit-btn">Complete Payment</button>
        </form>
    </div>
</div>

<script>
    let currentUserId = null;
    const username = localStorage.getItem('username');

    if (!username) {
        window.location.href = 'index.html';
    } else {
        fetch('/api/auth/me?username=' + username)
            .then(response => {
                if (!response.ok) throw new Error();
                return response.json();
            })
            .then(user => {
                currentUserId = user.id;
                if (user.role === "ADMIN") {
                    document.getElementById('admin-nav').classList.remove('hidden');
                }
                const balance = user.virtualCard && user.virtualCard.balance !== undefined ? user.virtualCard.balance : 0;
                document.getElementById('current-balance').textContent = balance.toFixed(2);
            })
            .catch(() => {
                localStorage.removeItem('username');
                window.location.href = 'index.html';
            });
    }

    document.querySelector('.logout-btn').addEventListener('click', () => {
        localStorage.removeItem('username');
    });

    document.getElementById('cardNumber').addEventListener('input', function (e) {
        let target = e.target;
        let val = target.value.replace(/\D/g, '');
        val = val.replace(/(.{4})/g, '$1 ').trim();
        target.value = val;
    });

    document.getElementById('expiry').addEventListener('input', function (e) {
        let target = e.target;
        let val = target.value.replace(/\D/g, '');
        if (val.length >= 3) {
            val = val.substring(0, 2) + '/' + val.substring(2, 4);
        }
        target.value = val;
    });

    document.getElementById('cvv').addEventListener('input', function (e) {
        this.value = this.value.replace(/\D/g, '');
    });

    function setAmount(val) {
        document.getElementById('amount').value = val;
    }

    document.getElementById('paymentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msgBox = document.getElementById('message-box');
        msgBox.style.display = 'none';
        msgBox.className = 'msg-box';

        if (!currentUserId) {
            msgBox.textContent = 'User validation error. Please log in again.';
            msgBox.classList.add('error');
            msgBox.style.display = 'block';
            return;
        }

        const rawCardNumber = document.getElementById('cardNumber').value.replace(/\s+/g, '');
        const topupAmount = parseFloat(document.getElementById('amount').value);

        try {
            const response = await fetch('/api/payment/' + currentUserId + '/topup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    creditCardNumber: rawCardNumber,
                    amount: topupAmount
                })
            });

            if (response.ok) {
                const updatedPassenger = await response.json();
                const newBalance = updatedPassenger.virtualCard.balance;
                document.getElementById('current-balance').textContent = newBalance.toFixed(2);

                msgBox.textContent = 'Top-up successful! Your balance has been updated.';
                msgBox.classList.add('success');
                msgBox.style.display = 'block';

                document.getElementById('paymentForm').reset();
            } else {
                const errorData = await response.json();
                if (errorData && errorData.errors) {
                    msgBox.innerHTML = errorData.errors.join('<br>');
                } else {
                    msgBox.textContent = 'Top-up failed. Please check your card details and limits.';
                }
                msgBox.classList.add('error');
                msgBox.style.display = 'block';
            }
        } catch (err) {
            msgBox.textContent = 'Could not connect to the server.';
            msgBox.classList.add('error');
            msgBox.style.display = 'block';
        }
    });
</script>
</body>
</html>
