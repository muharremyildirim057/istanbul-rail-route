<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İstanbul Rail-Route - Bakiye Yükleme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .metro-gradient {
            background: linear-gradient(135deg, #1e3a8a 0%, #dc2626 100%);
        }
    </style>
</head>
<body class="metro-gradient min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">

<div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-6 md:p-8 space-y-6 border border-gray-100 relative">

    <div id="payment-notification" class="hidden p-3 rounded-lg text-sm font-semibold flex items-center shadow-inner transition-all">
        <i id="payment-notif-icon" class="mr-2 text-base shrink-0"></i>
        <span id="payment-notif-text"></span>
    </div>

    <div class="text-center">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-green-50 text-green-600 text-2xl shadow-sm mb-2">
            <i class="fa-solid fa-wallet"></i>
        </div>
        <h2 class="text-xl font-black text-gray-900 tracking-tight">Güvenli Bakiye Yükleme</h2>
        <p class="text-xxs text-gray-400 font-bold uppercase tracking-widest mt-0.5">Sanal İstanbulkart Ödeme Paneli</p>
    </div>

    <div class="bg-slate-50 border border-gray-100 rounded-xl p-4 text-center shadow-inner">
        <p class="text-xxs font-black text-gray-400 uppercase tracking-widest mb-1">Mevcut Kart Bakiyeniz</p>
        <h3 id="current-balance-text" class="text-3xl font-black text-blue-900 tracking-wide">0.00 TL</h3>
    </div>

    <form onsubmit="submitPayment(event)" class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Kredi Kartı Numarası (Luhn Denetimli)</label>
            <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-credit-card"></i>
                    </span>
                <input type="text" id="input-cc" required class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-600 focus:border-transparent outline-none transition-all placeholder-gray-300 text-sm font-medium tracking-wide" placeholder="Örn: 49927398716">
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Yüklenecek Tutar (TL)</label>
            <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-turkish-lira-sign"></i>
                    </span>
                <input type="number" id="input-amount" required min="1" step="0.5" class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-600 focus:border-transparent outline-none transition-all placeholder-gray-300 text-sm font-bold" placeholder="100">
            </div>
            <div class="mt-2 flex flex-col space-y-0.5 text-[10px] text-gray-400 font-semibold uppercase tracking-wider bg-gray-50 p-2 rounded-lg border border-gray-100">
                <span>• Minimum Yükleme: 30 TL</span>
                <span>• Maksimum Yükleme: 3500 TL</span>
                <span>• Toplam Kart Limiti: 5000 TL</span>
            </div>
        </div>

        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all active:scale-[0.99] cursor-pointer mt-2">
            <i class="fa-solid fa-shield-halved mr-1"></i> Sistemi Tetikle & Bakiye Yükle
        </button>
    </form>

    <div class="text-center pt-2">
        <button onclick="window.location.href='/dashboard.html'" class="text-xs font-bold text-gray-400 hover:text-gray-600 transition-all cursor-pointer outline-none">
            <i class="fa-solid fa-arrow-left mr-1"></i> Ana Menüye Geri Dön
        </button>
    </div>

</div>

<script>
    var currentUser = null;

    // Sayfa ilk yüklendiğinde oturumu doğrula ve mevcut bakiyeyi merkeze yaz
    window.onload = function() {
        var savedUser = localStorage.getItem('currentUser');

        if (!savedUser) {
            window.location.href = '/index.html';
            return;
        }

        currentUser = JSON.parse(savedUser);

        // Ekranın tam ortasındaki bakiye alanını iki basamaklı (fixed) güncelliyoruz
        if (currentUser.virtualCard && currentUser.virtualCard.balance !== undefined) {
            document.getElementById('current-balance-text').innerText = currentUser.virtualCard.balance.toFixed(2) + ' TL';
        }
    };

    // Bildirim Mesajı Yönetimi (Tırnak çakışmaları ve kaymalar tamamen önlendi)
    function showNotification(text, type) {
        var notif = document.getElementById('payment-notification');
        var icon = document.getElementById('payment-notif-icon');
        var msg = document.getElementById('payment-notif-text');

        msg.innerText = text;
        notif.className = 'p-3 rounded-lg text-sm font-semibold flex items-center shadow-inner mb-2';
        icon.className = 'fa-solid mr-2 text-base';

        if (type === 'success') {
            notif.classList.add('bg-green-100', 'text-green-800', 'border', 'border-green-200');
            icon.classList.add('fa-circle-check');
        } else {
            notif.classList.add('bg-red-100', 'text-red-800', 'border', 'border-red-200');
            icon.classList.add('fa-triangle-exclamation');
        }
        notif.classList.remove('hidden');
    }

    // BACKEND FINANSAL TETİKLEME İŞLEMİ (POST /api/passengers/{id}/topup)
    async function submitPayment(event) {
        event.preventDefault();
        document.getElementById('payment-notification').classList.add('hidden');

        var ccInput = document.getElementById('input-cc').value;
        var amountInput = parseFloat(document.getElementById('input-amount').value);

        try {
            // Backend'deki dinamik adresi eski usul artı (+) ile sorunsuz birleştiriyoruz
            var response = await fetch('/api/payment/' + currentUser.id + '/topup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ creditCardNumber: ccInput, amount: amountInput })
            });

            if (response.ok) {
                var updatedUser = await response.json();

                // 1. Tarayıcı cüzdan hafızasını yeni güncel verilerle tazeliyoruz
                localStorage.setItem('currentUser', JSON.stringify(updatedUser));

                // 2. Ekranın ortasındaki bakiyeyi anında güncelliyoruz
                document.getElementById('current-balance-text').innerText = updatedUser.virtualCard.balance.toFixed(2) + ' TL';

                // 3. Başarı uyarısını verip tam istediğin gibi dashboard.html sayfasına yönlendiriyoruz
                showNotification('Bakiye başarıyla yüklendi! Ana menüye aktarılıyorsunuz...', 'success');

                setTimeout(function() {
                    window.location.href = '/dashboard.html';
                }, 1500);
            } else {
                // GlobalExceptionHandler kulesinden fırlayan List<String> kargo paketini yakalıyoruz
                var errorObj = await response.json();
                if (errorObj.errors && errorObj.errors.length > 0) {
                    showNotification(errorObj.errors[0], 'error');
                } else {
                    showNotification('Cüzdan limit doğrulaması başarısız oldu!', 'error');
                }
            }
        } catch (error) {
            showNotification('Finans sunucusuna bağlanılamadı!', 'error');
        }
    }
</script>
</body>
</html>
